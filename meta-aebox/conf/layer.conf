# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-aebox"
BBFILE_PATTERN_meta-aebox = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-aebox = "6"

LAYERDEPENDS_meta-aebox = "core"
LAYERSERIES_COMPAT_meta-aebox = "kirkstone"
